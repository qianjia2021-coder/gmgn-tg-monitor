name: test-moodeng-cloud
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install telethon requests
      - name: Test cloud moodeng takeover
        env:
          MOODENG_TG_API_ID: ${{ secrets.MOODENG_TG_API_ID }}
          MOODENG_TG_API_HASH: ${{ secrets.MOODENG_TG_API_HASH }}
          MOODENG_TG_STRING_SESSION: ${{ secrets.MOODENG_TG_STRING_SESSION }}
          DBOTX_API_KEY: ${{ secrets.DBOTX_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 cloud_moodeng.py
