name: empire-sol-trending-cloud

on:
  schedule:
    # 公共仓库 Actions 定时会被限流（实测数小时一轮），云端靠「24h 宽窗口 + 游标」
    # 保证不漏单；cron 仅作为兜底触发。
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: empire-sol-trending
  cancel-in-progress: false

env:
  ESTR_GH_REPO: ${{ github.repository }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 本机心跳检查
        id: hb
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 与 cloud_trending.py 保持同一口径：读取心跳文件内的 UTC 时间戳，
          # 而非 commit 时间，避免两套时钟导致判定不一致。
          HB=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "User-Agent: gh-runner" \
            "https://api.github.com/repos/${{ github.repository }}/contents/empire_sol_trending_heartbeat.txt" \
            | python3 -c "import sys,json,base64;d=json.load(sys.stdin);print(base64.b64decode(d['content']).decode().strip().rsplit(' ',1)[-1] if isinstance(d,dict) and 'content' in d else '')" 2>/dev/null || echo "")
          if [ -z "$HB" ]; then
            echo "无心跳文件 → 云端接管"
            echo "takeover=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          AGE=$(( $(date +%s) - $(date -d "$HB" +%s) ))
          echo "本机心跳距今 ${AGE}s"
          if [ "$AGE" -lt 300 ]; then
            echo "本机在线，云端本轮跳过"
            echo "takeover=false" >> "$GITHUB_OUTPUT"
          else
            echo "本机已关机/无响应，云端接管（仅记录去重）"
            echo "takeover=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.hb.outputs.takeover == 'true'
      - uses: actions/setup-python@v5
        if: steps.hb.outputs.takeover == 'true'
        with:
          python-version: '3.11'
      - run: pip install telethon
        if: steps.hb.outputs.takeover == 'true'
      - name: Run cloud takeover (record-only, no push)
        if: steps.hb.outputs.takeover == 'true'
        env:
          ESTR_TG_API_ID: ${{ secrets.ESTR_TG_API_ID }}
          ESTR_TG_API_HASH: ${{ secrets.ESTR_TG_API_HASH }}
          ESTR_TG_STRING_SESSION: ${{ secrets.ESTR_TG_STRING_SESSION }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 从仓库拉取最新实现（含公共模块），保证本机部署后即刻生效。
          for f in cloud_trending.py estr_common.py; do
            curl -s -H "Authorization: Bearer $GITHUB_TOKEN" -H "User-Agent: gh-runner" \
              "https://api.github.com/repos/${{ github.repository }}/contents/$f" \
              | python3 -c "import sys,json,base64;print(base64.b64decode(json.load(sys.stdin)['content']).decode())" > "$f"
          done
          python3 cloud_trending.py
