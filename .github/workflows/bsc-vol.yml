name: bsc-vol-monitor

on:
  schedule:
    # 错峰：避开整点/整五分（GitHub 调度高峰容易延迟或跳过）
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bsc-vol-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install --quiet telethon pysocks

      - name: Run takeover check
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_STRING_SESSION: ${{ secrets.TG_STRING_SESSION }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python cloud_bscvol.py
