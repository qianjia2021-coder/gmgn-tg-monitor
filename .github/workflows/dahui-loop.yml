name: dahui-loop

# 自延续链路：一个 job 内部每 5 分钟检查一次本机心跳，
# 本机离线就跑 cloud_dahui.py 接管；job 结束前自动 dispatch 下一棒。
# 每轮把结果写入 loop_beat.txt，便于外部核对（GitHub schedule 常延迟/不触发）。
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: dahui
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install gmgn-cli
        run: npm install -g gmgn-cli
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: 5 分钟一轮，本机离线则接管
        env:
          GH_TOKEN: ${{ secrets.GMGN_GH_TOKEN }}
          DAHUI_TG_API_ID: ${{ secrets.DAHUI_TG_API_ID }}
          DAHUI_TG_API_HASH: ${{ secrets.DAHUI_TG_API_HASH }}
          DAHUI_TG_STRING_SESSION: ${{ secrets.DAHUI_TG_STRING_SESSION }}
          GMGN_API_KEY: ${{ secrets.GMGN_API_KEY }}
          DBOTX_API_KEY: ${{ secrets.DBOTX_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          END=$(( $(date +%s) + 19200 ))
          N=0
          while [ "$(date +%s)" -lt "$END" ]; do
            N=$((N+1))
            echo "=== iteration $N $(date -u +%FT%TZ) ==="
            HB=$(curl -s --max-time 15 -H "Authorization: Bearer $GH_TOKEN" -H "User-Agent: gh-runner" \
              "https://api.github.com/repos/${{ github.repository }}/commits?path=heartbeat_dahui.txt&per_page=1" \
              | python3 -c "import sys,json;d=json.load(sys.stdin);print(d[0]['commit']['committer']['date'] if d else '')" 2>/dev/null || echo "")
            AGE=999999
            if [ -n "$HB" ]; then
              AGE=$(( $(date +%s) - $(date -d "$HB" +%s) ))
            fi
            echo "heartbeat age=${AGE}s"
            ACTION="skip(local online)"
            if [ "$AGE" -ge 120 ]; then
              echo "本机已关机/无响应，云端接管"
              ACTION="takeover"
              timeout 300 python3 cloud_dahui.py || ACTION="takeover-failed"
            else
              echo "本机在线，本轮跳过"
            fi
            N="$N" AGE="$AGE" ACTION="$ACTION" python3 - <<'PY' || true
import os, base64, json, urllib.request, time
repo = "qianjia2021-coder/gmgn-tg-monitor"
tok = os.environ["GH_TOKEN"]
path = "loop_beat.txt"
line = "iter=%s | %s | hb_age=%ss | %s\n" % (
    os.environ.get("N"), time.strftime("%Y-%m-%d %H:%M:%SZ", time.gmtime()),
    os.environ.get("AGE"), os.environ.get("ACTION"))
h = {"Authorization": "Bearer " + tok, "Accept": "application/vnd.github+json", "User-Agent": "dahui-loop"}
url = "https://api.github.com/repos/%s/contents/%s" % (repo, path)
sha = None
try:
    sha = json.load(urllib.request.urlopen(urllib.request.Request(url, headers=h), timeout=15))["sha"]
except Exception:
    pass
body = {"message": "loop beat [skip ci]", "content": base64.b64encode(line.encode()).decode()}
if sha:
    body["sha"] = sha
urllib.request.urlopen(urllib.request.Request(url, data=json.dumps(body).encode(), method="PUT",
    headers={**h, "Content-Type": "application/json"}), timeout=20).read()
PY
            SLEEP=$(( 300 - ($(date +%s) % 300) ))
            [ "$SLEEP" -lt 60 ] && SLEEP=60
            echo "sleep ${SLEEP}s"
            sleep "$SLEEP"
          done
          echo "=== 链路交接：dispatch 下一棒 ==="
          curl -s -X POST --max-time 20 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "User-Agent: dahui-loop" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/dahui-loop.yml/dispatches" \
            -d '{"ref":"main"}' -o /dev/null -w "dispatch http=%{http_code}\n"
