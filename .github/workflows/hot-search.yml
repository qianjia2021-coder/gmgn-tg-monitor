name: gmgn-hotsearch-monitor
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hotsearch
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: 本机心跳检查（开机本地/关机云端，互斥接力）
        id: hb
        uses: actions/github-script@v7
        with:
          script: |
            const { data: commits } = await github.rest.repos.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: 'heartbeat.txt',
              per_page: 1
            });
            if (!commits || commits.length === 0) {
              core.warning('无 heartbeat.txt，云端接管');
              core.setOutput('takeover', 'true');
              return;
            }
            const hb = Date.parse(commits[0].commit.committer.date);
            const age = Math.round((Date.now() - hb) / 1000);
            core.info('本机心跳距今 ' + age + 's');
            if (age < 240) {
              core.warning('本机在线，云端本轮跳过（双端互斥）');
              core.setOutput('takeover', 'false');
            } else {
              core.info('本机已关机（心跳过期>4min），云端接管扫描');
              core.setOutput('takeover', 'true');
            }
      - uses: actions/setup-node@v4
        if: steps.hb.outputs.takeover == 'true'
        with:
          node-version: '20'
      - name: Install gmgn-cli
        if: steps.hb.outputs.takeover == 'true'
        run: npm install -g gmgn-cli
      - uses: actions/setup-python@v5
        if: steps.hb.outputs.takeover == 'true'
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
        if: steps.hb.outputs.takeover == 'true'
      - name: Run GMGN hot-search monitor (SOL+BSC, 云端接管模式)
        if: steps.hb.outputs.takeover == 'true'
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_STRING_SESSION: ${{ secrets.TG_STRING_SESSION }}
          GMGN_API_KEY: ${{ secrets.GMGN_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DBOTX_API_KEY: ${{ secrets.DBOTX_API_KEY }}
          TG_HOTSEARCH_CHAT_ID: '5499948080'
        run: python3 cloud_hot_search.py
