name: gmgn-hotsearch-monitor
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hotsearch
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: 本机心跳检查（开机本地/关机云端，互斥接力）
        run: |
          HB=$(gh api "repos/${{ github.repository }}/commits?path=heartbeat.txt&per_page=1" --jq '.[0].commit.committer.date // ""' 2>/dev/null || echo "")
          if [ -z "$HB" ]; then
            echo "::warning:: 无心跳文件，本机从未开机写入 → 云端接管"
            exit 0
          fi
          AGE=$(( $(date +%s) - $(date -d "$HB" +%s) ))
          echo "本机心跳距今 ${AGE}s"
          if [ "$AGE" -lt 240 ]; then
            echo "::warning:: 本机在线，云端本轮跳过（双端互斥）"
            exit 0
          fi
          echo "本机已关机（心跳过期>4min），云端接管扫描"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install gmgn-cli
        run: npm install -g gmgn-cli
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run GMGN hot-search monitor (SOL+BSC, 云端接管模式)
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_STRING_SESSION: ${{ secrets.TG_STRING_SESSION }}
          GMGN_API_KEY: ${{ secrets.GMGN_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DBOTX_API_KEY: ${{ secrets.DBOTX_API_KEY }}
          TG_HOTSEARCH_CHAT_ID: '5499948080'
        run: python3 cloud_hot_search.py
