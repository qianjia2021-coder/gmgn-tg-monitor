name: picks-cloud

on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'picks_cloud_hb.txt'
  workflow_dispatch:
    inputs:
      force:
        description: '强制接管（忽略本机心跳，用于测试）'
        required: false
        default: 'false'
      selftest:
        description: '只做会话自检，不抓榜不推送'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: picks-cloud
  cancel-in-progress: false

jobs:
  picks:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 本机心跳检查（本机在线则让路，离线才接管）
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force }}
          SELFTEST: ${{ inputs.selftest }}
        run: |
          if [ "$SELFTEST" = "true" ]; then
            echo "会话自检模式"
            echo "takeover=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$FORCE" = "true" ]; then
            echo "手动强制接管（测试）"
            echo "takeover=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HB=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "User-Agent: picks-cloud" \
            "https://api.github.com/repos/${{ github.repository }}/commits?path=picks_heartbeat.txt&per_page=1" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print(d[0]['commit']['committer']['date'] if d else '')" 2>/dev/null || echo "")
          if [ -z "$HB" ]; then
            echo "无本机心跳 → 云端接管"
            echo "takeover=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          AGE=$(( $(date +%s) - $(date -d "$HB" +%s) ))
          echo "本机心跳距今 ${AGE}s"
          if [ "$AGE" -lt 420 ]; then
            echo "本机在线，云端本轮让路"
            echo "takeover=false" >> "$GITHUB_OUTPUT"
          else
            echo "本机已离线，云端接管"
            echo "takeover=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 维持云端心跳链（本机在线让路时也续链，保证关机后仍能自触发）
        # schedule 触发的让路轮不续链：否则 schedule 与 push 两条链叠加，
        # 每轮 275 秒的处理能力会被双倍触发拖成排队
        if: steps.gate.outputs.takeover != 'true' && inputs.selftest != 'true' && github.event_name != 'schedule'
        env:
          GH_TOKEN: ${{ secrets.PICKS_GH_PAT }}
        run: |
          sleep 275
          API="https://api.github.com/repos/${{ github.repository }}/contents/picks_cloud_hb.txt"
          for i in 1 2 3; do
            TS=$(date +%s)
            B64=$(printf '{"ts":%s,"rows":0,"new":0,"idle":1}' "$TS" | base64 -w0)
            SHA=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "User-Agent: picks-cloud" "$API?ref=main" \
              | python3 -c "import sys,json;print(json.load(sys.stdin).get('sha',''))" 2>/dev/null || echo "")
            if [ -n "$SHA" ]; then S=",\"sha\":\"$SHA\""; else S=""; fi
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -X PUT \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              -H "User-Agent: picks-cloud" -H "Content-Type: application/json" \
              "$API" -d "{\"message\":\"picks cloud hb (idle)\",\"content\":\"$B64\",\"branch\":\"main\"$S}")
            echo "云端心跳链续写第 $i 次 HTTP $CODE"
            [ "$CODE" = "200" ] && break
            sleep 6
          done

      - name: 安装 Python
        if: steps.gate.outputs.takeover == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        if: steps.gate.outputs.takeover == 'true'
        run: pip install --quiet telethon==1.45.0

      - name: 运行精选云端兜底（只推送，不模拟买入）
        if: steps.gate.outputs.takeover == 'true'
        env:
          PICKS_TG_API_ID: ${{ secrets.PICKS_TG_API_ID }}
          PICKS_TG_API_HASH: ${{ secrets.PICKS_TG_API_HASH }}
          PICKS_TG_STRING_SESSION: ${{ secrets.PICKS_TG_STRING_SESSION }}
          PICKS_CHAT_ID: '-5589667040'
          GITHUB_TOKEN: ${{ secrets.PICKS_GH_PAT }}
          PICKS_SELFTEST: ${{ inputs.selftest == 'true' && '1' || '0' }}
        run: python3 cloud_picks.py
