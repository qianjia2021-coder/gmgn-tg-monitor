name: ave-7777-monitor
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install telethon requests
      - run: python cloud_ave_7777.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}