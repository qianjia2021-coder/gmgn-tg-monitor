name: onchain-alpha-forward
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: onchain-alpha
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: 本机心跳检查（开机本地/关机云端，互斥接力）
        id: hb
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HB=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "User-Agent: gh-runner" "https://api.github.com/repos/${{ github.repository }}/commits?path=heartbeat.txt&per_page=1" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d[0]['commit']['committer']['date'] if d else '')" 2>/dev/null || echo "")
          if [ -z "$HB" ]; then
            echo "无心跳文件或查询失败 → 云端接管"
            echo "takeover=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          AGE=$(( $(date +%s) - $(date -d "$HB" +%s) ))
          echo "本机心跳距今 ${AGE}s"
          if [ "$AGE" -lt 240 ]; then
            echo "本机在线，云端本轮跳过（双端互斥）"
            echo "takeover=false" >> "$GITHUB_OUTPUT"
          else
            echo "本机已关机（心跳过期>4min），云端接管扫描"
            echo "takeover=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.hb.outputs.takeover == 'true'
        with:
          python-version: '3.11'
      - name: Install deps
        if: steps.hb.outputs.takeover == 'true'
        run: pip install telethon requests
      - name: Run onchain-alpha forward monitor (云端接管模式)
        if: steps.hb.outputs.takeover == 'true'
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_STRING_SESSION: ${{ secrets.TG_STRING_SESSION }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TG_TARGET_CHAT_ID: '5499948080'
        run: python3 cloud_onchain_alpha.py
