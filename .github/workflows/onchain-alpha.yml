name: onchain-alpha-forward
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: onchain-alpha
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install telethon requests
      - name: Run onchain-alpha forward monitor (FORCE test)
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_STRING_SESSION: ${{ secrets.TG_STRING_SESSION }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TG_TARGET_CHAT_ID: '5499948080'
        run: python3 cloud_onchain_alpha.py
