name: bsc-singlebuys-cloud

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install telethon
      - name: Run cloud BSC singlebuys monitor
        env:
          BSC_TG_API_ID: ${{ secrets.BSC_TG_API_ID }}
          BSC_TG_API_HASH: ${{ secrets.BSC_TG_API_HASH }}
          BSC_TG_STRING_SESSION: ${{ secrets.BSC_TG_STRING_SESSION }}
        run: python cloud_bsc_monitor.py
