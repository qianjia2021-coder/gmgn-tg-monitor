name: gmgn-tg-monitor

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install gmgn-cli
        run: npm install -g gmgn-cli

      - name: Run SOL monitor scan (stonk)
        env:
          GMGN_API_KEY: ${{ secrets.GMGN_API_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          CHAIN: sol
          INTERVAL: 5m
          MIN_SWAPS: '1000'
          MAX_SWAPS: '999999999'
          MIN_VOLUME: '10000'
          MAX_CREATED: '24h'
          PLATFORM: 'stonk|shturl|pump'
          ADDR_SUFFIX: ''
          EXCLUDE_ADDR_SUFFIX: 'pump'
        run: python3 monitor.py

      - name: Commit seen state (if changed)
        continue-on-error: true
        run: |
          git config user.name "gmgn-monitor-bot"
          git config user.email "gmgn-monitor-bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || git commit -m "chore: update seen state [skip ci]"
          git pull --rebase origin main || true
          git push
